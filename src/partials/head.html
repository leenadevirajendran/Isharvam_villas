<!doctype html>
<html lang="en" class="no-js" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | Isharvam Villas</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#10213D">
{{robots}}
<meta property="og:title" content="{{title}} | Isharvam Villas">
<meta property="og:description" content="{{desc}}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{root}}assets/img/site/hero-sm.webp">
<link rel="preconnect" href="https://images.pexels.com" crossorigin>
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/jost-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/fonts/newsreader-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
{{css}}
<script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
</head>
